name: Daily News Briefing

on:
  schedule:
    # 매일 한국 시간(KST, UTC+9) 아침 08:05 실행 (UTC 23:05)
    - cron: '5 23 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 지원

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 뉴스 브리핑 실행 (뉴스 수집 및 AI 요약)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: 'Asia/Seoul'
        run: |
          python briefing.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html news.json
          if git diff --staged --quiet; then
            echo "변경사항이 없어 커밋을 생략합니다."
          else
            git commit -m "chore: update daily news briefing [skip ci]"
            git push
          fi

